version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./neurosymbolic.db
      - SECRET_KEY=production-secure-neurosymbolic-key-2026
    volumes:
      - ./ml/artifacts:/app/ml/artifacts
      - ./knowledge_base:/app/knowledge_base

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
